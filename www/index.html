<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0f1511"><title>WeedMap</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@5/dist/maplibre-gl.css">
<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5/dist/maplibre-gl.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#0f1511;--sf:#18211b;--sf2:#222e26;--tx:#eef3ea;--mu:#8a9a8c;--ac:#6ba02c;--fr:#e8b84a;--ln:#2c3b30;--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px)}
:root[data-t=light]{--bg:#f3f6ef;--sf:#fff;--sf2:#e9eee4;--tx:#18211b;--mu:#66756a;--ln:#d9e1d3}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,system-ui,"SF Pro Text",sans-serif;-webkit-user-select:none;user-select:none}
input,textarea{-webkit-user-select:text;user-select:text}
#map{position:fixed;inset:0}
.glass{background:color-mix(in srgb,var(--sf) 84%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid var(--ln)}
.hid{display:none!important}.mu{color:var(--mu);font-size:14px;margin:0 0 10px}
#top{position:fixed;left:14px;right:14px;top:calc(var(--st) + 10px);display:flex;justify-content:space-between;align-items:center;z-index:5}
#me{padding:7px 16px 7px 8px;border-radius:99px;display:flex;gap:8px;align-items:center;font-weight:650;letter-spacing:-.2px}
#me img{width:26px;height:26px}#acts{display:flex;gap:8px}
.ib{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:var(--tx);padding:0}
.ib svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#loc{position:fixed;right:14px;bottom:calc(var(--sb) + 30px);z-index:5}
#add{position:fixed;left:50%;bottom:calc(var(--sb) + 22px);transform:translateX(-50%);z-index:5;width:72px;height:72px;border-radius:50%;border:0;background:var(--ac);box-shadow:0 8px 26px rgba(107,160,44,.5);display:grid;place-items:center}
#add img{width:40px;filter:brightness(0) invert(1)}
body.s #add,body.s #loc{opacity:0;pointer-events:none}
#toast{position:fixed;left:50%;top:calc(var(--st) + 68px);transform:translate(-50%,-14px);opacity:0;transition:.25s;z-index:30;padding:10px 16px;border-radius:14px;font-size:14px;max-width:88vw;text-align:center;pointer-events:none}
#toast.on{opacity:1;transform:translate(-50%,0)}
.sh{position:fixed;left:0;right:0;bottom:0;z-index:8;max-height:72dvh;overflow:auto;padding:12px 18px calc(var(--sb) + 18px);border-radius:24px 24px 0 0;transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1)}
.sh.on{transform:none}
.sh:before{content:"";display:block;width:38px;height:4px;border-radius:2px;background:var(--ln);margin:0 auto 12px}
h2{font-size:21px;margin:0 0 10px;letter-spacing:-.4px}
h3{font-size:14px;color:var(--mu);margin:16px 0 6px;font-weight:600}
input,textarea{width:100%;padding:13px;border-radius:12px;border:1px solid var(--ln);background:var(--sf2);color:var(--tx);font:inherit;margin-bottom:8px;outline:0}
input:focus,textarea:focus{border-color:var(--ac)}
.btn{width:100%;padding:14px;border:0;border-radius:14px;background:var(--ac);color:#fff;font-weight:650;font-size:16px;font-family:inherit}
.btn.g{background:var(--sf2);color:var(--tx)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 13px;background:var(--sf2);border-radius:14px;margin-bottom:6px}
.row small{display:block;color:var(--mu);font-size:13px}
.row button{border:0;border-radius:10px;padding:8px 13px;background:var(--ac);color:#fff;font-weight:650}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:7px}
.seg{display:flex;background:var(--sf2);border-radius:12px;padding:3px;margin-bottom:6px}
.seg button{flex:1;border:0;background:none;color:var(--mu);padding:9px;border-radius:10px;font-weight:650;font-family:inherit;font-size:15px}
.seg .on{background:var(--sf);color:var(--tx)}
.mk{position:relative;width:42px;height:42px;border-radius:50%;background:var(--bg);border:3px solid var(--ac);display:grid;place-items:center;box-shadow:0 4px 12px rgba(0,0,0,.4)}
.mk.f{border-color:var(--fr)}.mk img{width:22px}
.mk b{position:absolute;top:-8px;right:-8px;min-width:21px;height:21px;padding:0 5px;border-radius:11px;background:var(--tx);color:var(--bg);font-size:12px;display:grid;place-items:center}
.pd{width:18px;height:18px;border-radius:50%;background:#3b9eff;border:3px solid #fff;animation:p 2s infinite}
@keyframes p{0%{box-shadow:0 0 0 0 rgba(59,158,255,.6)}70%,100%{box-shadow:0 0 0 18px rgba(59,158,255,0)}}
.maplibregl-ctrl-bottom-left{margin-bottom:var(--sb)}
#auth{position:fixed;inset:0;z-index:20;background:radial-gradient(120% 80% at 50% 0,#1d2d1c,var(--bg) 62%);display:flex;flex-direction:column;justify-content:center;padding:calc(var(--st) + 24px) 28px calc(var(--sb) + 24px)}
:root[data-t=light] #auth{background:radial-gradient(120% 80% at 50% 0,#dcebcd,var(--bg) 62%)}
#auth>img{width:84px;margin:0 auto 10px}
#auth h1{text-align:center;font-size:32px;margin:0 0 4px;letter-spacing:-.8px}
#auth .mu{text-align:center;margin-bottom:26px}
#af{max-width:360px;width:100%;margin:0 auto}
#sw{text-align:center;color:var(--ac);font-weight:650;margin-top:14px}
#er{color:#ff6b6b;text-align:center;min-height:20px;font-size:14px;margin-top:8px}
</style></head><body>
<div id="map"></div>
<div id="top"><div id="me" class="glass"><img src="leaf.png" alt=""><span id="nm"></span></div>
<div id="acts"><button class="ib glass" id="bF" aria-label="Amis"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.6 3.2-5.5 6.5-5.5s5.9 1.9 6.5 5.5M16 4.7a3.5 3.5 0 010 6.6M18 14.8c1.9.7 3.2 2.4 3.5 5.2"/></svg></button>
<button class="ib glass" id="bS" aria-label="Réglages"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg></button></div></div>
<button class="ib glass" id="loc" aria-label="Ma position"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="8"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg></button>
<button id="add" aria-label="Ajouter une session"><img src="leaf.png" alt=""></button>
<div id="toast" class="glass"></div>
<div id="sAdd" class="sh glass"><h2>Nouvelle session</h2><input id="aT" placeholder="Titre (facultatif)" maxlength="60"><textarea id="aN" rows="2" placeholder="Note (facultatif)" maxlength="300"></textarea><p id="aM" class="mu"></p><button class="btn" id="aS">Enregistrer ici</button></div>
<div id="sPts" class="sh glass"></div>
<div id="sFr" class="sh glass"><h2>Amis</h2><input id="q" placeholder="Chercher un pseudo" autocapitalize="none"><div id="res"></div>
<h3>Demandes reçues</h3><div id="pend"></div><h3>Mes amis</h3><div id="frs"></div></div>
<div id="sSet" class="sh glass"><h2>Réglages</h2>
<h3>Thème</h3><div class="seg"><button data-th="dark">Sombre</button><button data-th="light">Clair</button></div>
<h3>Carte</h3><div class="seg"><button data-gl="1">Globe</button><button data-gl="0">À plat</button></div>
<h3>Mot de passe</h3><input id="npw" type="password" placeholder="Nouveau mot de passe (6 caractères min.)" autocomplete="new-password"><button class="btn g" id="pw">Changer le mot de passe</button>
<h3>Compte</h3><button class="btn g" id="out">Se déconnecter</button></div>
<div id="auth"><img src="leaf.png" alt=""><h1>WeedMap</h1><p class="mu">La carte de tes sessions, avec tes amis.</p>
<form id="af"><input id="u" placeholder="Pseudo" autocomplete="username" autocapitalize="none" required><input id="p" type="password" placeholder="Mot de passe" autocomplete="current-password" required><button class="btn" id="go">Se connecter</button><div id="sw">Créer un compte</div><div id="er"></div></form></div>
<script>
const SB=supabase.createClient("https://xqrvstjcxylehvtxhekf.supabase.co","sb_publishable_KgfI0EMTBE-NNPLeV-cUEg_u1MH6ZkY",{auth:{persistSession:true,autoRefreshToken:true}}),DOM="@cigmap.local";
const $=s=>document.querySelector(s),$$=s=>document.querySelectorAll(s),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const STY={dark:"https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json",light:"https://basemaps.cartocdn.com/gl/positron-gl-style/style.json"};
let theme=localStorage.getItem("wm-t")||(matchMedia("(prefers-color-scheme: light)").matches?"light":"dark"),globe=localStorage.getItem("wm-g")!="0";
let map,me,pts=[],mks=[],pos=null,pick=false,here=null,uMk,watching=false,first=true;
function applyTheme(){document.documentElement.dataset.t=theme;$("meta[name=theme-color]").content=theme=="dark"?"#0f1511":"#f3f6ef";$$("[data-th]").forEach(b=>b.classList.toggle("on",b.dataset.th==theme));$$("[data-gl]").forEach(b=>b.classList.toggle("on",(b.dataset.gl=="1")==globe))}
const toast=m=>{const t=$("#toast");t.textContent=m;t.classList.add("on");setTimeout(()=>t.classList.remove("on"),3800)};
const openS=id=>{closeAll();$("#"+id).classList.add("on");document.body.classList.add("s")},closeAll=()=>{$$(".sh").forEach(s=>s.classList.remove("on"));document.body.classList.remove("s")};
const gps=()=>new Promise((ok,ko)=>{if(!navigator.geolocation)return ko("Localisation indisponible sur cet appareil.");
 navigator.geolocation.getCurrentPosition(p=>ok({lat:p.coords.latitude,lng:p.coords.longitude}),e=>ko(e.code==1?"Localisation refusée : active-la dans Réglages > Confidentialité > Service de localisation > WeedMap.":"Position introuvable. Réessaie ou touche la carte."),{enableHighAccuracy:true,timeout:12000,maximumAge:5000})});
function initMap(){
 map=new maplibregl.Map({container:"map",style:STY[theme],center:[10,25],zoom:1.5,attributionControl:false,dragRotate:false,touchPitch:false});
 map.touchZoomRotate.disableRotation();
 map.addControl(new maplibregl.AttributionControl({compact:true}),"bottom-left");
 map.on("style.load",()=>map.setProjection({type:globe?"globe":"mercator"}));
 map.on("moveend",draw);
 map.on("click",e=>{if(pick){pos={lat:e.lngLat.lat,lng:e.lngLat.lng};pick=false;$("#aM").textContent="Endroit choisi. Appuie sur Enregistrer."}else closeAll()});
}
function draw(){
 mks.forEach(m=>m.remove());mks=[];const cl=[];
 for(const p of pts){const q=map.project([p.lng,p.lat]);let c=cl.find(c=>Math.hypot(c.x-q.x,c.y-q.y)<44);
  if(c)c.l.push(p);else cl.push({x:q.x,y:q.y,lng:p.lng,lat:p.lat,l:[p]})}
 for(const c of cl){const mine=c.l.some(p=>p.user_id==me.id),el=document.createElement("div");
  el.innerHTML=`<div class="mk${mine?"":" f"}"><img src="leaf.png" alt="">${c.l.length>1?`<b>${c.l.length}</b>`:""}</div>`;
  el.onclick=e=>{e.stopPropagation();showPts(c.l)};
  mks.push(new maplibregl.Marker({element:el}).setLngLat([c.lng,c.lat]).addTo(map))}
}
function showPts(l){
 l=[...l].sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));
 $("#sPts").innerHTML=`<h2>${l.length>1?l.length+" sessions à cet endroit":"Session"}</h2>`+l.map(p=>{const mine=p.user_id==me.id,n=mine?"Moi":p.profiles?.username||"?";
  return `<div class="row"><div><span class="dot" style="background:var(--${mine?"ac":"fr"})"></span><b>${esc(n)}</b>${p.title?`<small style="color:var(--tx)">${esc(p.title)}</small>`:""}<small>${new Date(p.created_at).toLocaleString("fr-FR",{dateStyle:"medium",timeStyle:"short"})}</small>${p.note?`<small>${esc(p.note)}</small>`:""}</div></div>`}).join("");
 openS("sPts")}
async function load(){const{data}=await SB.from("cigarettes").select("*, profiles(username)").order("created_at",{ascending:false}).limit(2000);pts=data||[];draw()}
function track(){if(watching||!navigator.geolocation)return;watching=true;
 navigator.geolocation.watchPosition(p=>{here=[p.coords.longitude,p.coords.latitude];
  if(!uMk){const el=document.createElement("div");el.innerHTML='<div class="pd"></div>';uMk=new maplibregl.Marker({element:el}).setLngLat(here).addTo(map)}else uMk.setLngLat(here);
  if(first){first=false;map.flyTo({center:here,zoom:14})}},()=>{watching=false},{enableHighAccuracy:true,maximumAge:5000})}
$("#loc").onclick=async()=>{if(here)return map.flyTo({center:here,zoom:15});try{const p=await gps();map.flyTo({center:[p.lng,p.lat],zoom:15});track()}catch(e){toast(e)}};
$("#add").onclick=async()=>{pick=false;pos=null;$("#aT").value="";$("#aN").value="";$("#aM").textContent="Position en cours…";openS("sAdd");
 try{pos=await gps();$("#aM").textContent="Position trouvée."}catch(e){$("#aM").textContent=e+" Tu peux toucher la carte pour choisir l'endroit.";pick=true}};
$("#aS").onclick=async()=>{
 if(!pos){pick=true;$("#aM").textContent="Touche la carte pour choisir l'endroit.";return}
 const row={user_id:me.id,lat:pos.lat,lng:pos.lng},t=$("#aT").value.trim(),n=$("#aN").value.trim();
 let r=await SB.from("cigarettes").insert(t||n?{...row,title:t||null,note:n||null}:row);
 if(r.error&&(t||n))r=await SB.from("cigarettes").insert(row);
 if(r.error){$("#aM").textContent="Échec : "+r.error.message;return}
 closeAll();await load();map.flyTo({center:[pos.lng,pos.lat],zoom:Math.max(map.getZoom(),15)})};
async function loadFr(){
 const F=k=>`*, profiles!friendships_${k}_fkey(username)`,T=SB.from.bind(SB);
 const[a,b,c]=await Promise.all([T("friendships").select(F("user_id")).eq("friend_id",me.id).eq("status","pending"),T("friendships").select(F("friend_id")).eq("user_id",me.id).eq("status","accepted"),T("friendships").select(F("user_id")).eq("friend_id",me.id).eq("status","accepted")]);
 $("#pend").innerHTML=(a.data||[]).map(f=>`<div class="row"><b>${esc(f.profiles.username)}</b><button data-ok="${f.id}">Accepter</button></div>`).join("")||'<p class="mu">Aucune demande.</p>';
 $("#frs").innerHTML=[...(b.data||[]),...(c.data||[])].map(f=>`<div class="row"><b>${esc(f.profiles.username)}</b></div>`).join("")||'<p class="mu">Pas encore d\'ami. Cherche un pseudo ci-dessus.</p>'}
$("#pend").onclick=async e=>{const id=e.target.dataset.ok;if(id){await SB.from("friendships").update({status:"accepted"}).eq("id",id);loadFr();load()}};
$("#q").oninput=async e=>{const q=e.target.value.trim().toLowerCase(),b=$("#res");b.innerHTML="";if(q.length<2)return;
 const{data}=await SB.from("profiles").select("id,username").ilike("username",q+"%").neq("id",me.id).limit(5);
 b.innerHTML=(data||[]).map(p=>`<div class="row"><b>${esc(p.username)}</b><button data-add="${p.id}">Ajouter</button></div>`).join("")};
$("#res").onclick=async e=>{const id=e.target.dataset.add;if(!id)return;e.target.disabled=true;const{error}=await SB.from("friendships").insert({user_id:me.id,friend_id:id,status:"pending"});e.target.textContent=error?"Déjà fait":"Envoyé"};
$("#bF").onclick=()=>{openS("sFr");loadFr()};$("#bS").onclick=()=>openS("sSet");
$$("[data-th]").forEach(b=>b.onclick=()=>{theme=b.dataset.th;localStorage.setItem("wm-t",theme);applyTheme();map.setStyle(STY[theme])});
$$("[data-gl]").forEach(b=>b.onclick=()=>{globe=b.dataset.gl=="1";localStorage.setItem("wm-g",globe?1:0);applyTheme();map.setProjection({type:globe?"globe":"mercator"})});
$("#pw").onclick=async()=>{const v=$("#npw").value;if(v.length<6)return toast("6 caractères minimum.");const{error}=await SB.auth.updateUser({password:v});toast(error?error.message:"Mot de passe modifié.");if(!error)$("#npw").value=""};
$("#out").onclick=async()=>{await SB.auth.signOut();location.reload()};
let signup=false;
$("#sw").onclick=()=>{signup=!signup;$("#go").textContent=signup?"Créer le compte":"Se connecter";$("#sw").textContent=signup?"J'ai déjà un compte":"Créer un compte"};
$("#af").onsubmit=async e=>{e.preventDefault();const u=$("#u").value.trim().toLowerCase(),p=$("#p").value,er=$("#er");er.textContent="";
 if(!/^[a-z0-9_.-]{3,20}$/.test(u))return er.textContent="Pseudo : 3 à 20 caractères (lettres, chiffres, _ . -).";
 if(signup){const{data,error}=await SB.auth.signUp({email:u+DOM,password:p});if(error)return er.textContent=/registered/i.test(error.message)?"Ce pseudo est déjà pris.":error.message;
  const{error:pe}=await SB.from("profiles").insert({id:data.user.id,username:u});if(pe)return er.textContent="Ce pseudo est déjà pris.";start(data.user)}
 else{const{data,error}=await SB.auth.signInWithPassword({email:u+DOM,password:p});if(error)return er.textContent="Pseudo ou mot de passe incorrect.";start(data.user)}};
async function start(u){
 const{data}=await SB.from("profiles").select("*").eq("id",u.id).single();
 if(!data){await SB.auth.signOut();return $("#er").textContent="Profil introuvable, réessaie."}
 me=data;$("#nm").textContent=me.username;$("#auth").classList.add("hid");
 if(!map)initMap();load();track()}
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&me)load()});
applyTheme();
SB.auth.getSession().then(({data})=>{if(data.session)start(data.session.user)});
</script></body></html>
